<html>
    <head>
        <link rel="stylesheet" href="index.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&family=Smythe&display=swap" rel="stylesheet">
    </head>
    <body>
        <header>
            <h1>Jimmy's Diner</h1>
            <h3>The best pizzas and burgers in town</h3>
        </header>
        <main>
            <section id="menuItems"></section>
            <section id="orderPreview"></section>
            <section id="orderConfirm"></section>
        </main>
        <div id="confirm-msg" class="confirm-msg"></div>
        <div id="modal" class="modal">
            <div class="modal-inner">
                <button id="close-btn" class="modal-close-btn">X</button>
                <h2>Enter card details</h2>
                <form>
                    <input required id="customer-name" class="form" type="text" placeholder="Enter your name">
                    <input required id="customer-card-number" class="form" type="text" placeholder="Enter card number">
                    <input required id="customer-cvv" class="form" type="text" placeholder="Enter cvv">
                    <button id="pay-btn" type="submit" class="green-btn">Pay</button>
                </form>
            </div>
        </div>
	<script src="index.js" type="module"></script>
    </body>
</html>
